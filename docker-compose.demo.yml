# Separate synthetic-only demo. Never add the private dashboard or Gmail secrets here.
services:
  demo:
    build: { context: ., target: runtime }
    command: ['node', 'dist/demo-main.js']
    environment:
      DEMO_ORIGIN: 'https://${DEMO_HOST:?Set DEMO_HOST}'
    restart: unless-stopped
    networks: [backend]

  auth:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.5
    env_file: ./secrets/demo-oauth.env
    command:
      - --provider=google
      - --http-address=0.0.0.0:4180
      - --upstream=http://demo:8080/
      - --redirect-url=https://${DEMO_HOST:?Set DEMO_HOST}/oauth2/callback
      - --authenticated-emails-file=/etc/oauth2-proxy/allowed-emails
      - --reverse-proxy=true
      - --trusted-proxy-ip=172.30.88.2/32
      - --code-challenge-method=S256
      - --insecure-oidc-skip-nonce=false
      - --cookie-name=__Host-postmaster
      - --cookie-secure=true
      - --cookie-httponly=true
      - --cookie-samesite=lax
      - --cookie-expire=1h
      - --session-cookie-minimal=true
      - --pass-basic-auth=false
      - --pass-user-headers=false
      - --request-logging=false
    volumes:
      - ./secrets/demo-allowed-emails:/etc/oauth2-proxy/allowed-emails:ro
    restart: unless-stopped
    networks:
      edge: {}
      backend: {}

  caddy:
    image: caddy:2.10.2
    environment:
      DEMO_HOST: '${DEMO_HOST:?Set DEMO_HOST}'
    ports: ['80:80', '443:443']
    volumes:
      - ./config/Caddyfile.demo:/etc/caddy/Caddyfile:ro
      - demo_caddy_data:/data
      - demo_caddy_config:/config
    restart: unless-stopped
    networks:
      edge:
        ipv4_address: 172.30.88.2

networks:
  edge:
    ipam:
      config: [{ subnet: 172.30.88.0/24 }]
  backend:
    internal: true

volumes:
  demo_caddy_data:
  demo_caddy_config:
