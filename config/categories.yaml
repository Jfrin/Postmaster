settings:
  label_prefix: 'AI/'
  confidence_threshold: 0.7
  fallback_category: needs_review
  dry_run: true # log decisions, change nothing in Gmail
  poll_interval_seconds: 300
  max_body_chars: 1500 # how much of each email the model sees
  daily_llm_call_cap: 2000 # hard stop on spend
  backlog_days: 7 # first run only looks this far back

rules: # checked first, no model call needed
  - match: { from_domain: 'github.com' }
    category: dev
  # - match: { from: "boss@company.com" }
  #   category: action_required

categories:
  - id: action_required
    label: 'Action Required'
    description: 'Asks you to reply, approve, sign or pay by a date'
    actions: [label, star]
  - id: work
    label: 'Work'
    description: 'Colleagues, clients, project and meeting threads'
    actions: [label]
  - id: personal
    label: 'Personal'
    description: 'Friends and family, non-commercial one-to-one mail'
    actions: [label]
  - id: finance
    label: 'Finance'
    description: 'Statements, invoices due, bank alerts, tax'
    actions: [label]
  - id: receipts
    label: 'Receipts'
    description: 'Purchase confirmations, shipping updates, paid invoices'
    examples:
      - 'Your order has shipped'
    actions: [label, mark_read, archive]
  - id: travel
    label: 'Travel'
    description: 'Bookings, boarding passes, itineraries, hotel mail'
    actions: [label]
  - id: security
    label: 'Security'
    description: 'Login alerts, password resets, verification codes'
    actions: [label]
  - id: newsletters
    label: 'Newsletters'
    description: 'Subscribed digests, blogs, Substack-style content'
    actions: [label, archive]
  - id: promotions
    label: 'Promotions'
    description: 'Sales, discounts, marketing blasts'
    actions: [label, mark_read, archive]
  - id: social
    label: 'Social'
    description: 'Social network and app activity notices'
    actions: [label, archive]
  - id: dev
    label: 'Dev'
    description: 'GitHub, CI results, cloud and service alerts'
    actions: [label, archive]
  - id: events
    label: 'Events'
    description: 'Invites, RSVPs, tickets, reminders'
    actions: [label]
  - id: needs_review
    label: 'Needs Review'
    description: 'Anything that does not clearly fit another category'
    actions: [label]
